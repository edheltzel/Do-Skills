name: site
on:
  pull_request:
    paths: ["site/**", "docs/**", "skills/**", ".github/workflows/site.yml"]
  push:
    branches: [master]
    paths: ["site/**", "docs/**", "skills/**", ".github/workflows/site.yml"]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: site/.nvmrc
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run check:links
      - run: npm run contrast
      - run: npm run flash
      - run: npm run install-box
